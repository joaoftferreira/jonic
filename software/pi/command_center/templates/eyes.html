<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonic eyes</title>
<link rel="stylesheet" href="/static/eyes.css">
</head>
<body>

<svg id="stage" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <!-- Everything that moves is clipped to the eye outline, so an iris at
         full gaze and the eyelid mid-blink both stop exactly at the white. -->
    <!-- One Chaos Emerald, ~10 x 13.5 units, centred on its own origin. The
         body takes its colour from the `color` of whatever <use>s it, and the
         facets are fixed light and dark washes on top, so a single fill drives
         the whole gem. The thin outline keeps the yellow one from vanishing
         against the white of the eye. -->
    <g id="gem">
      <path d="M -3.2,-6.75 L 3.2,-6.75 L 5,-2 L 0,6.75 L -5,-2 Z"
            fill="currentColor" stroke="#00000055" stroke-width="0.45"/>
      <path d="M -3.2,-6.75 L 3.2,-6.75 L 1.6,-2 L -1.6,-2 Z"
            fill="#ffffff" opacity="0.45"/>
      <path d="M 5,-2 L 1.6,-2 L 0,6.75 Z" fill="#ffffff" opacity="0.18"/>
      <path d="M -5,-2 L -1.6,-2 L 0,6.75 Z" fill="#000000" opacity="0.25"/>
    </g>

{% include "_actors.html" %}

    <clipPath id="contour-clip" clipPathUnits="userSpaceOnUse">
      <path d="{{ geometry.CONTOUR_PATH }}"/>
    </clipPath>
  </defs>

  <!-- #fit carries the fit-to-panel scale and the calibration; set from JS. -->
  <g id="fit">
    <path id="contour" d="{{ geometry.CONTOUR_PATH }}"/>

    <g clip-path="url(#contour-clip)">
      <!-- One group per eye. The two travel different distances, because the
           iris heading for the notch between them has far less room than the
           one heading away from it. -->
      {% for iris, shine in eyes %}
      <g class="eye">
        <!-- .pupil exists only so the emeralds can shrink the iris away. The
             gaze translate lives on .eye, so putting the scale here keeps the
             two from overwriting each other, and the rotate stays an attribute
             on the ellipses where CSS will not clobber it. -->
        <g class="pupil" style="transform-origin: {{ iris.cx }}px {{ iris.cy }}px">
          <ellipse class="iris" cx="{{ iris.cx }}" cy="{{ iris.cy }}"
                   rx="{{ iris.rx }}" ry="{{ iris.ry }}"
                   transform="rotate({{ iris.rot }} {{ iris.cx }} {{ iris.cy }})"/>
          <ellipse class="shine" cx="{{ shine.cx }}" cy="{{ shine.cy }}"
                   rx="{{ shine.rx }}" ry="{{ shine.ry }}"
                   transform="rotate({{ shine.rot }} {{ shine.cx }} {{ shine.cy }})"/>
        </g>
      </g>
      {% endfor %}

      <!-- Nine emeralds per eye. Positions are absolute user units so the
           ring can turn about an explicit pivot; see eyes.js. -->
      {% for eye in emerald_eyes %}
      <g class="gems">
        <g class="ring" style="transform-origin: {{ eye.cx }}px {{ eye.cy }}px;
                               animation-duration: {{ emeralds.SPIN_MS }}ms">
          {% for slot in eye.slots %}
          <use class="gem" href="#gem" style="color: {{ slot.color }}"
               data-slot="{{ slot.index }}"/>
          {% endfor %}
        </g>
        <use class="gem-center" href="#gem"
             style="color: {{ emeralds.CENTER_COLOR[1] }}"/>
      </g>
      {% endfor %}

      <!-- The "shoot Eggman" briefing. Hidden until it is played. -->
      <g class="scene">
        <g class="actor kid">
          <g class="pose aim"><use href="#kid-aim"/></g>
          <g class="pose cheer"><use href="#kid-happy"/></g>
        </g>
        <g class="actor eggman"><use href="#eggman"/></g>
        <g class="dart"><use href="#dart"/></g>
        <g class="boom"><use href="#boom"/></g>
      </g>

      <!-- The eyelid starts parked above the face and drops through it. -->
      <rect id="lid"
            x="{{ geometry.CONTOUR_BBOX[0] - 10 }}"
            y="{{ geometry.CONTOUR_BBOX[1] - 10 }}"
            width="{{ geometry.CONTOUR_BBOX[2] + 20 }}"
            height="{{ geometry.CONTOUR_BBOX[3] + 20 }}"
            fill="{{ lid_color }}"/>
    </g>
  </g>
</svg>

<!-- Only shown while the WebSocket is down, as a setup aid. -->
<div id="offline" hidden></div>

<script id="eyes-data" type="application/json">
{{ {
  "bbox": geometry.CONTOUR_BBOX,
  "center": geometry.CONTOUR_CENTER,
  "gazeTravel": gaze_travel,
  "gazeInnerRatio": gaze_inner_ratio,
  "blink": blink,
  "scene": {
    "kid": scene.KID_CENTER,
    "eggman": scene.EGGMAN_CENTER,
    "scale": scene.ACTOR_SCALE,
    "entrance": scene.ENTRANCE_OFFSET,
    "muzzle": scene.MUZZLE_OFFSET,
    "impact": scene.IMPACT_OFFSET,
    "dartScale": scene.DART_SCALE,
    "dartPath": dart_path,
    "t": scene.timeline(),
    "enterMs": scene.ENTER_MS,
    "shotMs": scene.SHOT_MS,
    "boomMs": scene.BOOM_MS,
    "cheerMs": scene.CHEER_MS,
    "exitMs": scene.EXIT_MS,
  },
  "emeralds": {
    "eyes": emerald_eyes,
    "ringRadius": emeralds.RING_RADIUS,
    "entryRadius": emeralds.ENTRY_RADIUS,
    "gemScale": emeralds.GEM_SCALE,
    "centerScale": emeralds.CENTER_GEM_SCALE,
    "entryMs": emeralds.ENTRY_MS,
    "flyMs": emeralds.FLY_MS,
    "staggerMs": emeralds.STAGGER_MS,
    "centerMs": emeralds.CENTER_MS,
    "degPerMs": emeralds.DEG_PER_MS,
  },
  "calibration": calibration,
} | tojson }}
</script>
<script src="/static/eyes.js"></script>
</body>
</html>
